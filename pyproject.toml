[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dreth"
version = "0.0.0"
description = "Experimental Python framework for learned structure and scoped authority under limited attention."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["dreth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dreth"
version = "0.1.0"
description = "Failure-shaped authority, lazy decomposition, and recursive nethra graphs."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/Dooces/dreth"
Issues = "https://github.com/Dooces/dreth/issues"

[project.scripts]
dreth = "dreth.cli:run"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["dreth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
